spring.application.name=ace-motors

# Lê as variáveis do arquivo .env da raiz do projeto
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# O schema é criado pelo Flyway; o Hibernate só confere se as entidades batem com ele
spring.jpa.hibernate.ddl-auto=validate
# Mantém a sessão do JPA aberta até a resposta ser montada (permite ler relacionamentos LAZY nos DTOs)
spring.jpa.open-in-view=true
spring.jpa.show-sql=true

# Rejeita JSON com atributos que não existem no DTO
spring.jackson.deserialization.fail-on-unknown-properties=true

# Pasta onde as imagens enviadas são salvas (servidas em /uploads/**)
app.upload-dir=${UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# JWT (RNF-A01/A03)
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}
