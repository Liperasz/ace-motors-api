# Mensagens do Bean Validation ({0} = nome do campo, demais argumentos = limites da anotação)
NotNull={0} é obrigatório(a)
NotBlank={0} é obrigatório(a)
NotEmpty={0} deve ter ao menos um item
Size={0} deve ter entre {2} e {1} caracteres
Email={0} deve ser um e-mail válido
Positive={0} deve ser maior que zero
PositiveOrZero={0} não pode ser negativo(a)
Min={0} deve ser no mínimo {1}
Max={0} deve ser no máximo {1}
Digits={0} deve ter no máximo {1} dígitos inteiros e {2} casas decimais
typeMismatch={0} tem um valor inválido
Pattern={0} está em um formato inválido

